<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
<<<<<<< HEAD

    <div class="container">
        <h2>To-Do Form</h2>

        <form id="todoForm">
            
            <input type="text" placeholder="Item ID" required><br>
            
            <input type="text" placeholder="Item UUID" required><br>
            
            <input type="text" placeholder="Item Hash" required><br>

            <input type="text" placeholder="Item Name" required><br>

            <textarea placeholder="Item Description" rows="4" required></textarea><br>

            <button type="submit">Submit</button>

        </form>
    </div>

    <h2>To-Do Form</h2>
    <form>
        <input type="text" placeholder="Item Name"><br><br>
         <input type="text" placeholder="Item ID"><br><br>
          <input type="text" placeholder="Item UUID"><br><br>
           <input type="text" placeholder="Item Hash"><br><br>
        <textarea placeholder="Item Description"></textarea><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
